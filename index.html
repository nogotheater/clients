<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>㈜지슨 주요 고객사 · 2026년 7월</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ════════════════════════════════════════════════════════════
지슨 디자인 시스템 v1.7 적용
1층 Primitive → 2층 Semantic → 3층 Component 순서로 정의.
3층 값은 반드시 2층을 참조 (예외: 제품 식별색 — 맨 아래 별도 표기)
════════════════════════════════════════════════════════════ */
:root{
/* ── 1층 Primitive ─────────────────────────────── */
--blue-50:#E8F2FD; --blue-100:#C9E3FC; --blue-200:#A9D4FA; --blue-300:#84BFF9; --blue-400:#62A8F8;
--blue-500:#408DF4; --blue-600:#256FEF; --blue-700:#1A45A3; --blue-800:#0B1F5C; --blue-850:#121F34; --blue-900:#060E2E;
--gray-0:#FFFFFF; --gray-50:#F3F5F8; --gray-100:#EEF1F5; --gray-150:#E6E9EE; --gray-200:#D9DEE4; --gray-300:#C3CAD2;
--gray-400:#9AA3AD; --gray-500:#8A939D; --gray-600:#6B7580; --gray-700:#565E68; --gray-750:#3F4753;
--gray-800:#2A323E; --gray-850:#1E2530; --gray-900:#161C25; --gray-950:#0F141B;
/* ── 2층 Semantic (라이트) ─────────────────────── */
--surface-page:var(--gray-50);
--surface-default:var(--gray-0);
--surface-muted:var(--gray-100);
--surface-brand-tint:var(--blue-50);
--text-primary:var(--gray-950);
--text-secondary:var(--gray-700);
--text-muted:var(--gray-600);
--text-disabled:var(--gray-400);
--text-brand:var(--blue-600);
--text-brand-strong:var(--blue-800);
--border-default:var(--gray-200);
--border-strong:var(--gray-300);
--border-brand:var(--blue-600);
--fill-brand:var(--blue-600);
--fill-brand-hover:var(--blue-700);
--on-brand:var(--gray-0);
/* ── 서체 ───────────────────────────────────────── */
--font-body:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
--font-latin:Heebo,var(--font-body);          /* 독립 영문 · 숫자: +2%, 자간 −0.01em */
/* ── 간격 (2mm = 8px) · 괘선 · 반경 ─────────────── */
--sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-6:48px; --sp-8:64px; --sp-12:96px;
--rule-thin:1px solid var(--border-default);   /* 0.5pt 행 구분 */
--rule-strong:1px solid var(--text-primary);   /* 1pt 그룹 머리 · 표의 위아래 */
--radius:8px;                                   /* 2mm 하나 */
/* ── 3층 Component ──────────────────────────────── */
--tile-bg:var(--surface-default);        --tile-border:var(--border-default);
--tile-bg-on:var(--surface-brand-tint);  --tile-border-on:var(--border-brand);  --tile-text-on:var(--text-brand-strong);
--tab-underline-on:var(--border-brand);  --tab-text-on:var(--text-brand-strong);
--cell-bg:var(--surface-default);        --cell-rule:var(--gray-150);   /* 화면용 행선: border-default보다 한 단계 연하게 */
--logo-bg:var(--surface-muted);          --logo-text:var(--text-primary);
/* ── 예외: 제품 식별색 — PDF 고객사 리스트 · Excel 마크 색과 동일. 시스템 램프 밖 (결정 필요) ── */
--mark-I:#1E2A78; --mark-S:#007AFF; --mark-B:#4A5FD9; --mark-D:#00A3E0; --mark-P:#0AB646; --mark-H:#1CB8D1; --mark-C:#CB2531;
--wrap:1240px;
--cols:5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
margin:0;background:var(--surface-page);color:var(--text-primary);
font-family:var(--font-body);font-size:16px;line-height:1.65;font-weight:400;
word-break:keep-all;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--border-brand);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--sp-3)}
/* 독립 영문 · 숫자 = Heebo (+2%, −0.01em) */
.latin,.num{font-family:var(--font-latin);letter-spacing:-0.01em}
/* ── 크기 단계 ─────────────────────────────────────── */
.t-hero{font-family:var(--font-latin);font-size:80px;font-weight:600;line-height:1;letter-spacing:-0.02em}
.t-title{font-size:32px;font-weight:700;line-height:1.25;letter-spacing:-0.02em}
.t-subtitle{font-size:22px;font-weight:600;line-height:1.35;letter-spacing:0}
.t-strong{font-size:18px;font-weight:700;line-height:1.45}
.t-label{font-size:16px;font-weight:400;line-height:1.5;color:var(--text-secondary)}
.t-caption{font-size:13px;font-weight:400;line-height:1.7;color:var(--text-muted)}
.t-seclabel{font-family:var(--font-latin);font-size:13px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted)}
/* ── page-header 부품: 1pt 괘선 · 좌 섹션 라벨 · 우 번호 ── */
.pagehead{background:var(--surface-default)}
.pagehead .rule{display:flex;justify-content:space-between;align-items:baseline;padding:var(--sp-2) 0 var(--sp-1);border-bottom:var(--rule-strong)}
.pagehead .rule .num{font-family:var(--font-latin);font-size:18px;font-weight:500;letter-spacing:-0.01em;color:var(--text-primary)}
/* ── masthead: 제목 + hero 숫자 ── */
.masthead{background:var(--surface-default);padding:var(--sp-4) 0 var(--sp-4)}
.masthead .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap}
.masthead h1{margin:0}
.masthead h1 .t-title{display:block}
.masthead h1 .t-label{display:block;margin-top:var(--sp-1)}
.hero{display:flex;align-items:baseline;gap:6px;color:var(--text-primary)}
.hero .t-label{color:var(--text-secondary)}
/* ── 제품 타일 ─────────────────────────────────────── */
.products{background:var(--surface-default);padding:0 0 var(--sp-4);border-bottom:var(--rule-thin)}
.products .head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-1)}
.products .head h2{margin:0;font-size:16px;font-weight:400;color:var(--text-secondary)}
.clear{background:none;border:0;padding:4px 0;font-size:13px;color:var(--text-brand);text-decoration:underline;text-underline-offset:3px;visibility:hidden}
.clear.show{visibility:visible}
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--sp-1)}
.tile{
display:flex;align-items:center;gap:10px;
padding:12px 14px;border:1px solid var(--tile-border);border-radius:var(--radius);background:var(--tile-bg);
text-align:left;transition:border-color .12s,background-color .12s;
}
.tile:hover{border-color:var(--border-strong)}
.tile .mk{flex:none}
.tile .t-name{font-family:var(--font-latin);font-size:13px;letter-spacing:-0.01em;color:var(--text-secondary);line-height:1.3}
.tile .t-count{font-family:var(--font-latin);font-size:22px;font-weight:600;letter-spacing:-0.01em;line-height:1.15;color:var(--text-primary)}
.tile .t-count small{font-family:var(--font-body);font-size:12px;font-weight:400;letter-spacing:0;color:var(--text-muted);margin-left:2px}
.tile[aria-pressed="true"]{background:var(--tile-bg-on);border-color:var(--tile-border-on)}
.tile[aria-pressed="true"] .t-name,.tile[aria-pressed="true"] .t-count{color:var(--tile-text-on)}
.tile.zero{opacity:.45}
/* 제품 마크 */
.mk{
display:inline-flex;align-items:center;justify-content:center;
width:18px;height:18px;border-radius:50%;
font-family:var(--font-latin);font-size:10.5px;font-weight:700;color:var(--gray-0);line-height:1;letter-spacing:0;
background:var(--pc,var(--text-secondary));
}
.mk-I{--pc:var(--mark-I)} .mk-S{--pc:var(--mark-S)} .mk-B{--pc:var(--mark-B)} .mk-D{--pc:var(--mark-D)}
.mk-P{--pc:var(--mark-P)} .mk-H{--pc:var(--mark-H)} .mk-C{--pc:var(--mark-C)}
/* ── 분류 탭 (sticky) ──────────────────────────────── */
.catbar{position:sticky;top:0;z-index:5;background:var(--surface-default);border-bottom:var(--rule-thin)}
.catbar .wrap{display:flex;align-items:center;gap:var(--sp-3)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{
flex:none;display:flex;align-items:baseline;gap:6px;
padding:14px 12px 12px;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;
font-size:16px;color:var(--text-secondary);white-space:nowrap;
}
.tab b{font-weight:500;color:var(--text-primary)}
.tab .n{font-family:var(--font-latin);font-size:13px;letter-spacing:-0.01em;color:var(--text-muted)}
.tab[aria-pressed="true"]{border-bottom-color:var(--tab-underline-on)}
.tab[aria-pressed="true"] b{color:var(--tab-text-on)}
.tab[aria-pressed="true"] .n{color:var(--text-brand)}
.tab.zero b{color:var(--text-disabled)}
.search{position:relative;flex:none}
.search input{
width:220px;height:38px;padding:0 12px 0 34px;border:1px solid var(--border-default);border-radius:var(--radius);background:var(--surface-muted);
font:inherit;font-size:16px;color:var(--text-primary);
}
.search input::placeholder{color:var(--text-disabled)}
.search input:focus{outline:none;border-color:var(--border-brand);background:var(--surface-default)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-disabled);pointer-events:none}
/* ── 결과 요약 ── */
.summary{padding:var(--sp-3) 0 0;font-size:16px;line-height:1.5;color:var(--text-secondary);min-height:24px}
.summary b{font-family:var(--font-latin);font-weight:600;letter-spacing:-0.01em;color:var(--text-primary)}
/* ── 섹션 · 그리드 ─────────────────────────────────── */
.section{padding:var(--sp-4) 0 0}
.section > h2{display:flex;align-items:baseline;gap:var(--sp-1);margin:0 0 10px;font-size:22px;font-weight:600;line-height:1.35}
.section > h2 .n{font-family:var(--font-latin);font-size:22px;font-weight:500;letter-spacing:-0.01em;color:var(--text-secondary)}
.section > h2 .of{font-family:var(--font-latin);font-size:16px;font-weight:400;letter-spacing:-0.01em;color:var(--text-muted)}
.region{margin-top:var(--sp-3)}
.region h3{display:flex;align-items:baseline;gap:6px;margin:0 0 var(--sp-1);font-size:18px;font-weight:700;line-height:1.45;color:var(--text-primary)}
.region h3 .n{font-family:var(--font-latin);font-size:16px;font-weight:400;letter-spacing:-0.01em;color:var(--text-muted)}
/* 표 괘선: 세로선 없음 · 가로 행선만(hairline) · 그룹 머리에 1pt 한 줄 */
.grid{
display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));
border-top:var(--rule-strong);
}
.cell{
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
min-height:150px;padding:var(--sp-3) var(--sp-3);background:var(--cell-bg);
border-bottom:1px solid var(--cell-rule);
}
.logo{
width:44px;height:44px;border-radius:50%;background:var(--logo-bg);
display:flex;align-items:center;justify-content:center;
font-size:15px;font-weight:500;color:var(--logo-text);
}
.logo.flag{font-size:26px;background:none}
.logo.img{background:none;border-radius:0;object-fit:contain}
.cell .name{margin:0;font-size:16px;font-weight:400;line-height:1.5;text-align:center;max-width:100%}
.cell .marks{display:flex;gap:4px;margin-top:2px}   /* 세로선이 없으므로 마크는 기관명 아래 중앙에 */
.cell .marks .mk{width:16px;height:16px;font-size:9.5px}
.cell .marks .mk.dim{opacity:.28}
.confidential{border:1px dashed var(--border-strong);border-radius:var(--radius);padding:var(--sp-3);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);flex-wrap:wrap;color:var(--text-secondary);font-size:15px;background:var(--surface-default)}
.confidential b{color:var(--text-primary);font-weight:600}
.confidential .pc{display:flex;gap:12px;flex-wrap:wrap}
.confidential .pc span{display:inline-flex;align-items:center;gap:5px;font-size:14px}
.confidential .pc .n{font-family:var(--font-latin);letter-spacing:-0.01em;color:var(--text-primary)}
.empty{padding:var(--sp-8) 0;text-align:center;color:var(--text-secondary)}
.empty p{margin:0 0 var(--sp-2)}
.empty button{border:0;background:var(--fill-brand);color:var(--on-brand);border-radius:var(--radius);padding:10px 16px;font-size:16px}
.empty button:hover{background:var(--fill-brand-hover)}
footer{margin-top:var(--sp-8);padding:var(--sp-3) 0 var(--sp-6);border-top:var(--rule-thin);color:var(--text-muted);font-size:13px;line-height:1.7}
footer .wrap{display:flex;justify-content:space-between;gap:var(--sp-2);flex-wrap:wrap}
/* ── 반응형 ─────────────────────────────────────────── */
@media (max-width:1100px){:root{--cols:4}.tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:860px){
:root{--cols:3}
.t-hero{font-size:56px}
.t-title{font-size:28px}
.tiles{grid-template-columns:repeat(3,1fr)}
.catbar .wrap{gap:10px}
.search input{width:150px}
}
@media (max-width:560px){
:root{--cols:1}
.wrap{padding:0 var(--sp-2)}
.masthead{padding:var(--sp-3) 0}
.masthead .wrap{align-items:flex-start;flex-direction:column;gap:var(--sp-2)}
.tiles{grid-template-columns:repeat(2,1fr)}
.tile{padding:10px 12px}
.catbar .wrap{flex-wrap:wrap;padding-bottom:10px}
.search{width:100%}.search input{width:100%}
/* 리스트형: 로고 · 기관명 · 마크 한 줄 */
.cell{flex-direction:row;justify-content:flex-start;gap:12px;min-height:0;padding:12px 4px 12px 2px}
.grid{border-top-color:var(--border-strong)}
.logo{width:34px;height:34px;font-size:13px;flex:none}
.logo.flag{font-size:22px}
.cell .name{flex:1;text-align:left}
.cell .marks{flex:none;gap:4px;margin:0;padding-left:var(--sp-1)}
.cell .marks .mk{width:18px;height:18px;font-size:10.5px}
.section > h2{font-size:20px}
.region h3{margin-bottom:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
body{background:#fff;font-size:12px}
.catbar{position:static}
.search,.clear{display:none}
.tile,.cell{break-inside:avoid}
}
</style>
</head>
<body>
<header class="pagehead">
<div class="wrap">
<div class="rule">
<span class="t-seclabel">GITSN · Client List</span>
<span class="num" id="basis-dot">2026.07</span>
</div>
</div>
</header>
<section class="masthead">
<div class="wrap">
<h1>
<span class="t-title">주요 고객사</span>
<span class="t-label">중앙정부·공공기관·지자체·금융·교육·해외·민간에 걸친 납품 실적입니다.</span>
</h1>
<p class="hero"><span class="t-hero" id="total-count">492</span><span class="t-label">개 기관</span></p>
</div>
</section>
<section class="products" aria-labelledby="products-h">
<div class="wrap">
<div class="head">
<h2 id="products-h">제품별로 보기 <span class="t-caption">여러 개 선택 가능</span></h2>
<button class="clear" id="clear-products" type="button">제품 선택 해제</button>
</div>
<div class="tiles" id="tiles" role="group" aria-label="제품 필터"></div>
</div>
</section>
<nav class="catbar" aria-label="고객사 분류">
<div class="wrap">
<div class="tabs" id="tabs" role="group" aria-label="분류 필터 (여러 개 선택 가능)"></div>
<label class="search">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
<input id="q" type="search" placeholder="기관명 검색" autocomplete="off" aria-label="기관명 검색">
</label>
</div>
</nav>
<main class="wrap">
<noscript><p class="summary">미리보기에서는 제품·분류 필터가 동작하지 않습니다. 웹 주소로 열면 필터와 검색을 쓸 수 있습니다.</p></noscript>
<p class="summary" id="summary" aria-live="polite"></p>
<div id="sections"></div>
</main>
<footer>
<div class="wrap">
<span>㈜지슨 · 주요 고객사 목록 · <span id="basis-ko">2026년 7월</span> 기준</span>
<span>B(Alpha-B)는 S 계열로 집계됩니다</span>
</div>

474,"g":"민간","r":null,"n":"","m":"C"},{"no":475,"g":"해외","r":null,"n":"미국","m":"H"},{"no":476,"g":"해외","r":null,"n":"중국","m":"D"},{"no":477,"g":"해외","r":null,"n":"영국","m":"H"},{"no":478,"g":"해외","r":null,"n":"사우디아라비아","m":"D"},{"no":479,"g":"해외","r":null,"n":"폴란드","m":"D"},{"no":480,"g":"해외","r":null,"n":"UAE","m":"D"},{"no":481,"g":"해외","r":null,"n":"싱가포르","m":"DPH"},{"no":482,"g":"해외","r":null,"n":"말레이시아","m":"DPH"},{"no":483,"g":"해외","r":null,"n":"멕시코","m":"D"},{"no":484,"g":"해외","r":null,"n":"모잠비크","m":"P"},{"no":485,"g":"해외","r":null,"n":"베트남","m":"P"},{"no":486,"g":"해외","r":null,"n":"카타르","m":"D"},{"no":487,"g":"해외","r":null,"n":"캄보디아","m":"D"},{"no":488,"g":"해외","r":null,"n":"보츠와나","m":"DPH"},{"no":489,"g":"해외","r":null,"n":"인도네시아","m":"D"},{"no":490,"g":"해외","r":null,"n":"태국","m":"D"},{"no":491,"g":"해외","r":null,"n":"튀르키예","m":"D"},{"no":492,"g":"해외","r":null,"n":"스페인","m":"D"}];
const PRODUCTS = [
['I','Alpha-I'],['S','Alpha-S'],['B','Alpha-B'],['D','Smart-D'],['P','Alpha-P'],['H','Alpha-H'],['C','Alpha-C']
];
const PNAME = Object.fromEntries(PRODUCTS);
const CATS = ['중앙정부','공공','지자체','지자체 의회','금융','교육','해외','민간'];
const REGIONS = ['수도권','충청권','호남권','영남권','강원권'];
const FLAG = {'말레이시아':'🇲🇾','멕시코':'🇲🇽','모잠비크':'🇲🇿','미국':'🇺🇸','베트남':'🇻🇳','보츠와나':'🇧🇼','사우디아라비아':'🇸🇦','스페인':'🇪🇸','싱가포르':'🇸🇬','아랍에미리트':'🇦🇪','영국':'🇬🇧','인도네시아':'🇮🇩','중국':'🇨🇳','카타르':'🇶🇦','캄보디아':'🇰🇭','태국':'🇹🇭','튀르키예':'🇹🇷','폴란드':'🇵🇱'};
const state = { products: new Set(), cats: new Set(), q: '' };
// ── helpers ──────────────────────────────────────────
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const matchProducts = row => state.products.size === 0 || [...state.products].some(p => row.m.includes(p));
const matchQuery = row => !state.q || row.n.toLowerCase().includes(state.q);
const matchCat = row => state.cats.size === 0 || state.cats.has(row.g);
const monogram = r => {
const name = r.n;
if (r.logo) return `<img class="logo img" src="${r.logo}" alt="" loading="lazy">`;
if (FLAG[name]) return `<div class="logo flag" aria-hidden="true">${FLAG[name]}</div>`;
const latin = name.match(/^[A-Za-z&]{1,3}/);
const txt = latin ? latin[0].toUpperCase().slice(0,2) : name.slice(0,1);
return `<div class="logo" aria-hidden="true">${esc(txt)}</div>`;
};
const markHtml = m => [...m].map(p => `<span class="mk mk-${p}${state.products.size && !state.products.has(p) ? ' dim' : ''}" title="${PNAME[p]}">${p}</span>`).join('');
// ── render: product tiles (counts respect category + search, not product) ──
function renderTiles(){
const base = DATA.filter(r => matchCat(r) && matchQuery(r));
const tiles = document.getElementById('tiles');
tiles.innerHTML = PRODUCTS.map(([p, name]) => {
const n = base.filter(r => r.m.includes(p)).length;
const on = state.products.has(p);
return `<button class="tile mk-${p}${n===0?' zero':''}" type="button" data-p="${p}" aria-pressed="${on}">
<span class="mk mk-${p}">${p}</span>
<span><span class="t-name">${name}</span><br><span class="t-count">${n}<small>개사</small></span></span>
</button>`;
}).join('');
document.getElementById('clear-products').classList.toggle('show', state.products.size > 0);
}
// ── render: category tabs (counts respect product + search) ──
function renderTabs(){
const base = DATA.filter(r => matchProducts(r) && matchQuery(r));
const tabs = document.getElementById('tabs');
const items = ['전체', ...CATS];
tabs.innerHTML = items.map(c => {
const n = c === '전체' ? base.length : base.filter(r => r.g === c).length;
const on = c === '전체' ? state.cats.size === 0 : state.cats.has(c);
return `<button class="tab${n===0?' zero':''}" type="button" data-c="${c}" aria-pressed="${on}"><b>${c}</b><span class="n">${n}</span></button>`;
}).join('');
}
// ── render: sections ──
function renderSections(){
const rows = DATA.filter(r => matchProducts(r) && matchQuery(r) && matchCat(r));
const filtered = state.products.size > 0 || state.q;
const host = document.getElementById('sections');
// summary
const sum = document.getElementById('summary');
const parts = [];
if (state.products.size) parts.push([...state.products].map(p => PNAME[p]).join(', ') + ' 납품');
if (state.cats.size) parts.push(CATS.filter(c => state.cats.has(c)).join(', '));
if (state.q) parts.push(`"${esc(state.q)}"`);
sum.innerHTML = parts.length
? `<b>${rows.length}</b>개 기관 · ${parts.join(' · ')}`
: `전체 <b>${DATA.length}</b>개 기관`;
if (rows.length === 0) {
host.innerHTML = `<div class="empty"><p>조건에 맞는 기관이 없습니다.</p><button type="button" id="reset-all">모든 필터 지우기</button></div>`;
return;
}
const cats = state.cats.size ? CATS.filter(c => state.cats.has(c)) : CATS;
host.innerHTML = cats.map(c => {
const list = rows.filter(r => r.g === c);
if (list.length === 0) return '';
const total = DATA.filter(r => r.g === c).length;
const head = `<h2>${c} <span class="n">${list.length}</span>${filtered && list.length !== total ? `<span class="of">/ ${total}</span>` : ''}</h2>`;
// 온라인 공개용: 민간 사명이 비어 있으면 개수·제품별 수만 표시
if (c === '민간' && list.every(r => !r.n)) {
const byP = PRODUCTS.map(([p,name]) => [p, name, list.filter(r => r.m.includes(p)).length]).filter(x => x[2] > 0);
return `<section class="section" id="cat-${c}">${head}<div class="confidential">
<div><b>민간 기업 ${list.length}개사</b><br>계약 조건에 따라 사명은 공개하지 않습니다.</div>
<div class="pc">${byP.map(([p,name,n]) => `<span><span class="mk mk-${p}">${p}</span>${name} <span class="n">${n}</span></span>`).join('')}</div>
</div></section>`;
}
let body;
if (c === '지자체' || c === '지자체 의회') {
body = REGIONS.map(rg => {
const sub = list.filter(r => r.r === rg);
if (!sub.length) return '';
return `<div class="region"><h3>${rg} <span class="n">${sub.length}</span></h3><div class="grid">${sub.map(cell).join('')}</div></div>`;
}).join('');
} else {
body = `<div class="grid">${list.map(cell).join('')}</div>`;
}
return `<section class="section" id="cat-${c}">${head}${body}</section>`;
}).join('');
}
function cell(r){
return `<article class="cell">${monogram(r)}<h4 class="name">${esc(r.n)}</h4><div class="marks">${markHtml(r.m)}</div></article>`;
}
function render(){ renderTiles(); renderTabs(); renderSections(); syncHash(); }
// ── URL state (shareable) ──
function syncHash(){
const p = new URLSearchParams();
if (state.products.size) p.set('p', [...state.products].join(''));
if (state.cats.size) p.set('c', CATS.filter(c => state.cats.has(c)).join(','));
if (state.q) p.set('q', state.q);
const h = p.toString();
try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch(e) {}
}
function readHash(){
let p; try { p = new URLSearchParams(location.hash.slice(1)); } catch(e) { return; }
const ps = p.get('p') || '';
[...ps].forEach(x => { if (PNAME[x]) state.products.add(x); });
(p.get('c') || '').split(',').forEach(c => { if (CATS.includes(c)) state.cats.add(c); });
const q = p.get('q'); if (q) { state.q = q.toLowerCase(); document.getElementById('q').value = q; }
}
// ── events ──
document.getElementById('tiles').addEventListener('click', e => {
const b = e.target.closest('.tile'); if (!b) return;
const p = b.dataset.p;
state.products.has(p) ? state.products.delete(p) : state.products.add(p);
render();
});
document.getElementById('clear-products').addEventListener('click', () => { state.products.clear(); render(); });
document.getElementById('tabs').addEventListener('click', e => {
const b = e.target.closest('.tab'); if (!b) return;
const c = b.dataset.c;
if (c === '전체') state.cats.clear();
else state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
render();
window.scrollTo({ top: document.querySelector('.catbar').offsetTop, behavior: 'auto' });
});
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sections').addEventListener('click', e => {
if (e.target.id === 'reset-all') {
state.products.clear(); state.cats.clear(); state.q = ''; document.getElementById('q').value = '';
render();
}
});
document.getElementById('total-count').textContent = DATA.length;
readHash();
render();
</script>
