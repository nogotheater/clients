<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지슨 주요 고객사</title>
<meta name="description" content="㈜지슨(GITSN) 보안 솔루션 납품 현황. 중앙정부, 공공기관, 지방자치단체, 금융·교육기관, 해외, 민간 기업 등 492개 고객사.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   지슨 디자인 시스템 v1.7 — 1층 Primitive
   ===================================================================== */
:root{
  --blue-50:#E8F2FD; --blue-100:#C9E3FC; --blue-200:#A9D4FA; --blue-300:#84BFF9; --blue-400:#62A8F8;
  --blue-500:#408DF4; --blue-600:#256FEF; --blue-700:#1A45A3; --blue-800:#0B1F5C; --blue-850:#121F34; --blue-900:#060E2E;
  --gray-0:#FFFFFF; --gray-50:#F3F5F8; --gray-100:#EEF1F5; --gray-150:#E6E9EE; --gray-200:#D9DEE4; --gray-300:#C3CAD2;
  --gray-400:#9AA3AD; --gray-500:#8A939D; --gray-600:#6B7580; --gray-700:#565E68; --gray-750:#3F4753;
  --gray-800:#2A323E; --gray-850:#1E2530; --gray-900:#161C25; --gray-950:#0F141B;
  --red-50:#FDEDEA; --red-100:#FAD4CE; --red-200:#F9BEB6; --red-300:#F6A198; --red-400:#EE8079; --red-500:#E75D5C; --red-600:#DF2E38; --red-700:#971829; --red-800:#530010; --red-900:#280206;
  --green-50:#E9F4EB; --green-100:#C9E7D0; --green-200:#ABDCBA; --green-300:#81CF9F; --green-400:#49BE83; --green-500:#0DA770; --green-600:#02855A; --green-700:#005C40; --green-800:#002F20; --green-900:#00170E;

  /* 2층 Semantic — 라이트 */
  --surface-page:var(--gray-50);
  --surface-default:var(--gray-0);
  --surface-muted:var(--gray-100);
  --surface-brand-tint:var(--blue-50);
  --text-primary:var(--gray-950);
  --text-secondary:var(--gray-700);
  --text-muted:var(--gray-600);
  --text-disabled:var(--gray-400);
  --text-inverse:var(--gray-0);
  --text-brand:var(--blue-600);
  --text-brand-strong:var(--blue-800);
  --border-default:var(--gray-200);
  --border-strong:var(--gray-300);
  --border-brand:var(--blue-600);
  --fill-brand:var(--blue-600);
  --fill-brand-hover:var(--blue-700);
  --on-brand:var(--gray-0);
  --text-danger:var(--red-600);   /* 입력 오류 문구 전용 */

  /* 3층 Component — 제품 마크. PDF 고객사 리스트의 제품 식별색 그대로. 다른 자리에 쓰지 않음
     (S·C는 1층 blue-600·red-600과 사실상 같아 1층 참조, 나머지 5개는 3층 예외값) */
  --mark-I:#1E2F5C; --mark-S:var(--blue-600); --mark-B:#4B57C9; --mark-D:#2A93D9;
  --mark-P:#27A24B; --mark-H:#1FA9A3; --mark-C:var(--red-600);

  /* 서체 */
  --font-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-latin:Heebo,"Pretendard Variable",Pretendard,system-ui,sans-serif;

  /* 간격 2mm 배수 → px */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px; --sp-15:56px;
  --radius:8px;          /* 2mm 하나 */
  --rule-thin:1px;       /* 0.5pt · border-default */
  --rule-thick:2px;      /* 1pt · text-primary */
  --nav-h:56px;
}
/* 2층 — 다크 (관제 화면 · 다크 페이지). <html data-theme="dark">로 전환 */
:root[data-theme="dark"]{
  --surface-page:var(--gray-950); --surface-default:var(--gray-900); --surface-muted:var(--gray-800); --surface-brand-tint:var(--blue-850);
  --text-primary:var(--gray-150); --text-secondary:var(--gray-400); --text-muted:var(--gray-500); --text-disabled:var(--gray-600);
  --text-inverse:var(--gray-950); --text-brand:var(--blue-400); --text-brand-strong:var(--blue-200);
  --border-default:var(--gray-800); --border-strong:var(--gray-750); --border-brand:var(--blue-400);
  --fill-brand:var(--blue-600); --fill-brand-hover:var(--blue-500); --on-brand:var(--gray-0);
}

/* =====================================================================
   기본
   ===================================================================== */
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);font-size:16px;line-height:1.65;font-weight:400;word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--sp-6)}
:focus-visible{outline:2px solid var(--border-brand);outline-offset:2px}

/* 서체 역할 */
.lat{font-family:var(--font-latin);font-size:1.02em;letter-spacing:-.01em}
.caps{font-family:var(--font-latin);letter-spacing:.06em;word-break:keep-all}
.t-hero{font-family:var(--font-latin);font-size:80px;font-weight:600;line-height:1;letter-spacing:-.02em}
.t-title{font-size:32px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.t-subtitle{font-size:22px;font-weight:600;line-height:1.35}
.t-strong{font-size:18px;font-weight:600;line-height:1.45}
.t-body{font-size:16px;font-weight:400;line-height:1.65}
.t-caption{font-size:13px;font-weight:400;line-height:1.7;color:var(--text-muted)}

/* =====================================================================
   머리 — page-header 부품: 1pt 괘선 · 좌 로고 · 우 기준일
   ===================================================================== */
.mast{background:var(--surface-default);border-bottom:var(--rule-thin) solid var(--border-default)}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);padding:var(--sp-6) 0 var(--sp-3);border-bottom:var(--rule-thin) solid var(--border-strong)}
.logo{height:32px;width:auto;display:block}
.ph-right{display:flex;align-items:center;gap:var(--sp-4)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 var(--sp-3);border-radius:var(--radius);border:var(--rule-thin) solid var(--border-strong);background:var(--surface-default);color:var(--text-brand-strong);font-size:14px;font-weight:600;white-space:nowrap}
.btn-ghost:hover{border-color:var(--border-brand)}
.print-note,.print-legend{display:none}
.mast-body{display:grid;grid-template-columns:1fr auto;gap:var(--sp-4) var(--sp-12);align-items:start;padding:var(--sp-8) 0 var(--sp-8)}
.mast-body h1{margin-bottom:var(--sp-3)}
.hero{display:flex;align-items:baseline;justify-content:flex-end;gap:var(--sp-2);color:var(--text-brand-strong);margin-top:-6px}
.hero .unit{font-family:var(--font-latin);font-size:22px;font-weight:500;letter-spacing:-.01em;color:var(--text-muted)}
.lead{max-width:34em;color:var(--text-secondary)}

/* =====================================================================
   필터 — 제품 타일 · 콜아웃 · 검색
   ===================================================================== */
.controls{background:var(--surface-default);border-bottom:var(--rule-thin) solid var(--border-default);padding:var(--sp-4) 0 var(--sp-6)}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-bottom:var(--sp-2)}
.sec-btn{display:flex;align-items:center;gap:var(--sp-3);min-height:56px;padding:var(--sp-2) var(--sp-4);border:var(--rule-thin) solid var(--border-default);border-radius:var(--radius);background:var(--surface-default);text-align:left;color:var(--text-primary);min-width:0}
.sec-btn:hover{border-color:var(--border-strong)}
.sec-btn .sn{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.sec-btn .sc{font-family:var(--font-latin);font-size:16.3px;font-weight:500;letter-spacing:-.01em;color:var(--text-muted)}
.sec-btn .sm{margin-left:auto;flex:none;font-family:var(--font-latin);font-size:14px;font-weight:500;letter-spacing:-.01em;color:var(--text-muted)}
.sec-btn[aria-pressed="true"] .sm{color:var(--text-brand)}
.sec-btn[aria-pressed="true"]{background:var(--surface-brand-tint);border-color:var(--border-brand);color:var(--text-brand-strong)}
.sec-btn[aria-pressed="true"] .sc{color:var(--text-brand-strong)}
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--sp-2)}
.tile{display:flex;align-items:center;gap:6px;padding:var(--sp-2) 10px;min-height:48px;border:var(--rule-thin) solid var(--border-default);border-radius:var(--radius);background:var(--surface-default);text-align:left;min-width:0;color:var(--text-primary)}
.tile:hover{border-color:var(--border-strong)}
.tile .tname{font-family:var(--font-latin);font-size:16.3px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tcount{margin-left:auto;font-family:var(--font-latin);font-size:16.3px;font-weight:500;letter-spacing:-.01em;color:var(--text-muted)}
.tile[aria-pressed="true"]{background:var(--surface-brand-tint);border-color:var(--border-brand);color:var(--text-brand-strong)}
.tile[aria-pressed="true"] .tcount{color:var(--text-brand-strong)}

.bar{display:flex;gap:var(--sp-3);align-items:flex-start;margin-top:var(--sp-3)}
/* callout: 키워드(Heebo title 700 text-brand) + 본문 */
.callout{flex:1;display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);min-height:64px;padding:var(--sp-3) var(--sp-6);border-radius:var(--radius);background:var(--surface-muted);color:var(--text-secondary)}
.callout.active{background:var(--surface-brand-tint);color:var(--text-brand-strong)}
.callout .kw{display:inline-flex;align-items:baseline;gap:var(--sp-1);color:var(--text-brand)}
.callout .kw b{font-family:var(--font-latin);font-size:32px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.callout .kw span{font-size:16px;font-weight:600;color:var(--text-brand-strong)}
.callout .chips{display:flex;flex-wrap:wrap;gap:var(--sp-1)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:var(--radius);background:var(--surface-default);border:var(--rule-thin) solid var(--border-brand);color:var(--text-brand-strong);font-family:var(--font-latin);font-size:16.3px;font-weight:500;letter-spacing:-.01em}
.callout .q{font-weight:600;color:var(--text-primary)}
.callout.active .q{color:var(--text-brand-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 var(--sp-4);border-radius:var(--radius);background:var(--fill-brand);color:var(--on-brand);font-size:16px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--fill-brand-hover)}
.callout .btn{margin-left:auto}

.search{position:relative;flex:none;width:280px}
.search input{width:100%;height:64px;padding:0 44px 0 var(--sp-4);border:var(--rule-thin) solid var(--border-default);border-radius:var(--radius);background:var(--surface-default);font-size:16px;color:var(--text-primary);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--text-muted)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search input:focus{border-color:var(--border-brand);outline:none}
.search .clear{position:absolute;right:var(--sp-2);top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:var(--radius);color:var(--text-muted);display:none;align-items:center;justify-content:center;font-size:20px;line-height:1}
.search .clear:hover{background:var(--surface-muted);color:var(--text-primary)}
.search.has .clear{display:inline-flex}

/* =====================================================================
   분야 이동 — 고정 탭
   ===================================================================== */
.catnav{position:sticky;top:0;z-index:10;background:var(--surface-default);border-bottom:var(--rule-thin) solid var(--border-default)}
.catnav ul{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;height:var(--nav-h)}
.catnav ul::-webkit-scrollbar{display:none}
.catnav button{display:flex;align-items:center;gap:6px;height:100%;padding:0 var(--sp-3);color:var(--text-secondary);font-size:16px;font-weight:500;white-space:nowrap;border-bottom:var(--rule-thick) solid transparent;margin-bottom:calc(var(--rule-thin) * -1);-webkit-tap-highlight-color:transparent}
.catnav button .c{font-family:var(--font-latin);font-size:13.3px;font-weight:500;letter-spacing:-.01em;color:var(--text-muted)}
.catnav button[aria-pressed="true"]{color:var(--text-brand-strong);border-bottom-color:var(--border-brand);font-weight:600}
.catnav button[aria-pressed="true"] .c{color:var(--text-brand)}
.catnav button.zero{color:var(--text-disabled)}
.catnav button.zero .c{color:var(--text-disabled)}

/* =====================================================================
   본문 — 표 그룹 머리(strong + 1pt) → 셀 격자
   ===================================================================== */
main{padding:var(--sp-2) 0 var(--sp-12)}
.sec{padding-top:var(--sp-12);scroll-margin-top:calc(var(--nav-h) + var(--sp-4))}
.sec-h{display:flex;align-items:baseline;gap:var(--sp-3);padding:0 0 var(--sp-4)}
.sec-h .tag{margin-left:auto;font-size:13px;font-weight:600;color:var(--text-brand-strong);background:var(--surface-brand-tint);padding:2px 10px;border-radius:var(--radius)}
.sec-h .c{font-family:var(--font-latin);font-size:22.4px;font-weight:600;letter-spacing:-.01em;color:var(--text-brand-strong)}
.sec-h .c small{font-size:16.3px;font-weight:400;color:var(--text-muted)}
.sub{display:flex;align-items:baseline;gap:var(--sp-2);margin:var(--sp-8) 0 var(--sp-3)}
.sub h3{font-size:18px;font-weight:600;line-height:1.45}
.sub .c{font-family:var(--font-latin);font-size:16.3px;font-weight:500;letter-spacing:-.01em;color:var(--text-muted)}
.subwrap:first-of-type .sub{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--sp-2)}
.card{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-2);background:var(--surface-default);border:var(--rule-thin) solid var(--border-default);border-radius:var(--radius);min-width:0}
.card.hide,.sec.hide,.subwrap.hide{display:none}
.av{flex:none;width:40px;height:40px;border-radius:var(--radius);display:grid;place-items:center;background:var(--surface-muted);color:var(--text-secondary);font-size:13px;font-weight:600;line-height:1;letter-spacing:-.01em}
.av.caps{font-size:12px;font-weight:600}
.av.logo{background:transparent;border:0;padding:0;border-radius:0;width:56px;height:40px}
.av.logo img{width:100%;height:100%;object-fit:contain;display:block}
.card .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:var(--sp-1)}
.card .name{font-size:16px;font-weight:400;line-height:1.3;color:var(--text-primary);min-width:0}
.card .name>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.card .name mark{background:var(--surface-brand-tint);color:var(--text-brand-strong);border-radius:2px;padding:0 1px}
.marks{display:flex;gap:3px}
.mk{--mk:16px;display:inline-flex;align-items:center;justify-content:center;width:var(--mk);height:var(--mk);border-radius:50%;background:var(--mark,var(--surface-muted));color:var(--on-brand);font-family:var(--font-latin);font-style:normal;font-size:calc(var(--mk) * .58);font-weight:700;line-height:var(--mk);text-align:center;letter-spacing:0}
.tile .mk,.chip .mk,.conf .mk{--mk:20px;padding-top:1px}
.mk[data-k="I"]{--mark:var(--mark-I)}.mk[data-k="S"]{--mark:var(--mark-S)}.mk[data-k="B"]{--mark:var(--mark-B)}.mk[data-k="D"]{--mark:var(--mark-D)}.mk[data-k="P"]{--mark:var(--mark-P)}.mk[data-k="H"]{--mark:var(--mark-H)}.mk[data-k="C"]{--mark:var(--mark-C)}
.marks .mk.off{background:var(--surface-muted);color:var(--text-disabled)}
.marks .mk.new{box-shadow:0 0 0 2px var(--surface-default),0 0 0 3.5px var(--border-brand)}
.card .newtag{position:absolute;left:8px;top:8px;font-family:var(--font-latin);font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--on-brand);background:var(--fill-brand);padding:2px 6px 1px;border-radius:var(--radius);display:none}
.card.is-new{position:relative}
.card.is-new .newtag{display:inline-block}
.mosel{position:relative;flex:none}
.mosel select{height:64px;padding:0 36px 0 var(--sp-4);border:var(--rule-thin) solid var(--border-default);border-radius:var(--radius);background:var(--surface-default);font-size:16px;color:var(--text-primary);-webkit-appearance:none;appearance:none;cursor:pointer}
.mosel::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.mosel.on select{background:var(--surface-brand-tint);border-color:var(--border-brand);color:var(--text-brand-strong);font-weight:600}
.monthly{background:var(--surface-default);border-bottom:var(--rule-thin) solid var(--border-default);padding:var(--sp-4) 0 var(--sp-6)}
.monthly h2{margin-bottom:var(--sp-3)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:var(--sp-2) var(--sp-4)}
.mlist li{display:grid;grid-template-columns:auto 1fr;gap:4px var(--sp-3);align-items:start;padding:var(--sp-2) var(--sp-3);border-radius:var(--radius);background:var(--surface-page)}
.mlist .tag{font-family:var(--font-latin);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px 2px;border-radius:var(--radius);color:var(--on-brand);background:var(--fill-brand);margin-top:3px;white-space:nowrap}
.mlist .tag.add{background:var(--surface-brand-tint);color:var(--text-brand-strong);font-family:var(--font-body);letter-spacing:0;font-weight:600;font-size:12px}
.mlist .who{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:15px;font-weight:600}
.mlist .who small{font-weight:400;color:var(--text-muted);font-size:13px}
.mlist .who .marks{gap:3px}
.mlist .memo{grid-column:2;font-size:14px;line-height:1.55;color:var(--text-secondary)}
.mlist .memo:empty{display:none}
.mlist li.note{grid-template-columns:1fr}
.mlist li.note .memo{grid-column:1}
@media (max-width:640px){.mlist{grid-template-columns:1fr}}

/* 데스크톱·태블릿: 카드형 (PDF 고객사 리스트와 같은 구성 — 위 로고 자리, 오른쪽 아래 마크, 아래 이름 칸) */
@media (min-width:641px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .card{position:relative;flex-direction:column;align-items:stretch;gap:0;padding:0;height:150px}
  .card .av{width:60px;height:60px;margin:12px auto 0;font-size:19px;flex:none}
  .card .av.caps{font-size:17px}
  .card .av.logo{width:128px;height:64px;margin:8px auto 0}
  .card .body{display:block;margin-top:auto;flex:none}
  .card .marks{position:absolute;right:8px;top:75px}
  .card .name{display:flex;align-items:center;justify-content:center;height:52px;padding:0 10px;border-top:var(--rule-thin) solid var(--border-default);text-align:center}
}
@media (min-width:961px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
}

/* 민간 — 표 배경 박스 */
.conf{background:var(--surface-muted);border-radius:var(--radius);padding:var(--sp-6);display:grid;grid-template-columns:1fr;gap:var(--sp-3)}
.conf .cn{font-size:18px;font-weight:600;line-height:1.45}
.conf .cn b{font-family:var(--font-latin);font-weight:600;letter-spacing:-.01em;color:var(--text-brand-strong)}
.conf .cn span{font-weight:400;color:var(--text-secondary)}
.conf .note{color:var(--text-secondary)}
.conf .pc{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4)}
.conf .pc span{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-family:var(--font-latin);font-size:16.3px;font-weight:500;letter-spacing:-.01em}
.conf .pc b{font-weight:600;color:var(--text-primary)}
.conf .gate{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2) var(--sp-3)}
.conf .gate label{color:var(--text-secondary)}
.conf .gate input{min-height:40px;width:220px;padding:0 var(--sp-3);border:var(--rule-thin) solid var(--border-default);border-radius:var(--radius);background:var(--surface-default);font-size:16px;color:var(--text-primary)}
.conf .gate input:focus{border-color:var(--border-brand);outline:none}
.conf .gate .msg{width:100%;color:var(--text-muted);font-size:13px;line-height:1.7}
.conf .gate .msg.err{color:var(--text-danger)}
.priv-actions{display:flex;justify-content:flex-end;margin-top:var(--sp-3)}

.empty{display:none;margin:var(--sp-15) 0;text-align:center;color:var(--text-secondary)}
.empty.show{display:block}
.empty b{display:block;font-size:18px;font-weight:600;color:var(--text-primary);margin-bottom:var(--sp-1)}
.empty .btn{margin-top:var(--sp-4)}

footer{border-top:var(--rule-thin) solid var(--border-default);background:var(--surface-default);padding:var(--sp-6) 0 var(--sp-8)}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap}
footer img{height:20px}

/* =====================================================================
   반응형
   ===================================================================== */
@media (max-width:960px){
  .secs{grid-template-columns:1fr}
  .sec-btn{min-height:48px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .mast-body{grid-template-columns:1fr;align-items:start;gap:var(--sp-4)}
  .hero{justify-content:flex-start;margin-top:0}
}
@media (max-width:640px){
  .wrap{padding:0 var(--sp-4)}
  .page-header{padding-top:var(--sp-4)}
  .logo{height:26px}
  .t-title{font-size:26px}
  .t-hero{font-size:56px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .bar{flex-direction:column}
  .search{width:100%}
  .search input{height:48px}
  .mosel select{height:48px;width:100%}
  .callout{min-height:56px;padding:var(--sp-3) var(--sp-4)}
  .callout .kw b{font-size:26px}
  .grid{grid-template-columns:1fr 1fr}
  .conf{grid-template-columns:1fr}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
@media print{
  @page{
    size:A4;margin:14mm 12mm 20mm;
    @bottom-left{content:"";font:400 7.5pt/1 "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#6B7580;vertical-align:top;padding-top:6mm}
    @bottom-right{content:counter(page) " / " counter(pages);font:500 7.5pt/1 Heebo,"Pretendard Variable",Pretendard,sans-serif;color:#6B7580;vertical-align:top;padding-top:6mm}
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:var(--gray-0)}
  .controls,.catnav,.btn,.search,.pdf-btn,.gate,.priv-actions,.empty,footer{display:none !important}
  .wrap{max-width:none;padding:0}
  .mast{border:0}
  .page-header{padding:0 0 3mm;border-bottom:.5pt solid var(--gray-300)}
  .logo{height:8mm}
  .ph-right .t-caption{font-size:8.5pt}
  .mast-body{grid-template-columns:1fr auto;gap:0 10mm;padding:6mm 0 0;align-items:start}
  .t-title{font-size:17pt}
  .lead{font-size:9pt;line-height:1.6;max-width:120mm;margin-top:1mm}
  .t-hero{font-size:32pt}
  .hero{margin-top:-1mm}
  .hero .unit{font-size:11pt}
  .print-note{display:block;margin:3mm 0 0;font-size:8.5pt;color:var(--text-brand-strong)}
  .print-legend{display:flex;justify-content:flex-end;gap:5mm;margin:5mm 0 0;padding-top:3mm;border-top:.5pt solid var(--gray-200);font-family:var(--font-latin);font-size:8pt;color:var(--text-secondary)}
  .print-legend span{display:inline-flex;align-items:center;gap:1.2mm}
  main{padding:0}
  .sec{padding-top:8mm;scroll-margin:0}
  .sec-h{padding:0 0 3mm;break-after:avoid;gap:2mm;align-items:baseline}
  .sec-h h2{font-size:13pt}
  .sec-h .c{font-size:13pt}
  .sec-h .c small{font-size:9pt}
  .sec-h .tag{font-size:8pt;padding:.5mm 2mm}
  .sub{margin:4mm 0 2mm;break-after:avoid}
  .sub h3{font-size:10.5pt}
  .sub .c{font-size:9.5pt}
  .grid{grid-template-columns:repeat(5,1fr) !important;gap:2.5mm}
  .card{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;border:.5pt solid var(--gray-300);border-radius:2mm;break-inside:avoid}
  .card .av{width:10mm;height:10mm;margin:2.5mm auto 0;font-size:10pt;border-radius:2mm}
  .card .av.caps{font-size:9pt}
  .card .body{display:block;margin-top:3mm}
  .card .marks{position:absolute;right:1.5mm;top:11.5mm;gap:.6mm}
  .mk{--mk:3.6mm;font-size:2.1mm;line-height:3.6mm;padding-top:0}
  .print-legend .mk{--mk:3.6mm}
  .card .name{display:flex;align-items:center;justify-content:center;height:8mm;padding:0 1.5mm;border-top:.5pt solid var(--gray-200);text-align:center;font-size:8pt;line-height:1.2}
  .card .name mark{background:none;color:inherit}
  .conf{padding:5mm;break-inside:avoid;gap:2mm 8mm}
  .conf .cn{font-size:11pt}
  .conf .note{font-size:9pt}
  .conf .pc span{font-size:9.5pt}
}
</style>
</head>

<script>
/* 대분류 — 제품 묶음. Alpha-P는 기관별 용도(ph)에 따라 도청/해킹으로 나뉨 */
const SECS = [
  {k:'E', name:'도청 보안',            products:['I','S','B','D','P']},
  {k:'K', name:'무선백도어 해킹 보안',  products:['P','H']},
  {k:'V', name:'불법촬영 보안',         products:['C']}
];
function secsOf(d){ /* 기관이 속한 대분류 집합 */
  const s = new Set();
  for (const k of d.m) {
    if ('ISBD'.includes(k)) s.add('E');
    else if (k === 'H') s.add('K');
    else if (k === 'P') s.add(d.ph ? 'K' : 'E');
    else if (k === 'C') s.add('V');
  }
  return s;
}
const PRODUCTS = [
  {k:'I', name:'Alpha-I'}, {k:'S', name:'Alpha-S'}, {k:'B', name:'Alpha-B'}, {k:'D', name:'Smart-D'},
  {k:'P', name:'Alpha-P'}, {k:'H', name:'Alpha-H'}, {k:'C', name:'Alpha-C'}
];
const GROUPS = ['중앙정부','공공','지자체','지자체 의회','금융','교육','해외','민간'];
const REGIONS = ['수도권','충청권','호남권','영남권','강원권'];
/* 분야별 정렬 규칙
   - 중앙정부 · 지자체 · 지자체 의회: 정해진 순서(o). 중앙정부는 서열, 지자체는 광역 → 기초
   - 민간: 재계순위(o)가 있는 기업 먼저, 나머지는 가나다
   - 교육: 학교 먼저(가나다), 그다음 교육청·교육지원청·직속기관(가나다)
   - 그 외(공공 · 금융 · 해외): 가나다 */
const MANUAL_GROUPS = new Set(['중앙정부','지자체','지자체 의회']);
const koCmp = (a, b) => String(a || '').localeCompare(String(b || ''), 'ko');
const isEduOffice = n => /교육청|교육지원청|수련원|연수원/.test(n || '');
function sortGroup(items, g){
  const arr = items.slice();
  if (MANUAL_GROUPS.has(g)) return arr.sort((a, b) => ((a.o ?? 1e9) - (b.o ?? 1e9)) || a.n - b.n);
  if (g === '민간') return arr.sort((a, b) => ((a.o ?? 1e9) - (b.o ?? 1e9)) || koCmp(a.name, b.name) || a.n - b.n);
  if (g === '교육') return arr.sort((a, b) => (isEduOffice(a.name) - isEduOffice(b.name)) || koCmp(a.name, b.name) || a.n - b.n);
  return arr.sort((a, b) => koCmp(a.name, b.name) || a.n - b.n);

function mono(name){
  let s = name.trim().replace(/^(㈜|\(주\)|주식회사)\s*/, '');
  let lat = s.match(/^[A-Za-z]+/);
  if (lat) return [lat[0].slice(0,3).toUpperCase(), true];
  for (const p of PREFIX) if (s.startsWith(p) && s.length > p.length + 1) { s = s.slice(p.length); break; }
  s = s.replace(/^[\s(]+/, '');
  lat = s.match(/^[A-Za-z]+/);
  if (lat) return [lat[0].slice(0,3).toUpperCase(), true];
  return [s.slice(0,2), false];
}

function highlight(name, q){
  if (!q) return esc(name);
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(name);
  return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i, i+q.length)) + '</mark>' + esc(name.slice(i+q.length));
}

  state.mo = MONTHS.includes(h.get('mo')) ? h.get('mo') : '';
  state.b = new Set((h.get('b') || '').split(',').filter(k => SECS.some(x => x.k === k)));
}
function writeHash(){
  const h = new URLSearchParams();
  if (state.p.size) h.set('p', [...state.p].join(','));
  if (state.c.size) h.set('c', [...state.c].join(','));
  if (state.q) h.set('q', state.q);
  if (state.mo) h.set('mo', state.mo);
  if (state.b.size) h.set('b', [...state.b].join(','));
  const s = h.toString();
  try { history.replaceState(null, '', s ? '#' + s : location.pathname + location.search); } catch (e) { /* 미리보기 창 등에서는 주소 갱신 생략 */ }
}
const isNewIn = (d, mo) => d.since === mo;
const newMarks = (d, mo) => d.ms ? Object.keys(d.ms).filter(k => d.ms[k] === mo && d.m.includes(k)) : [];
const inMonth = (d, mo) => !mo || isNewIn(d, mo) || newMarks(d, mo).length > 0;
function inScope(d, opts = {}){ /* 조건별로 하나씩 뺄 수 있는 매칭 */
  if (!inMonth(d, state.mo)) return false;
  if (!opts.noB && state.b.size && ![...secsOf(d)].some(k => state.b.has(k))) return false;
  if (!opts.noP && state.p.size && ![...state.p].some(k => d.m.includes(k))) return false;
  if (!opts.noC && state.c.size && !state.c.has(d.g)) return false;
  if (state.q && !d.name) return false;
  if (state.q && !d.name.toLowerCase().includes(state.q.toLowerCase())) return false;
  return true;
}
function matches(d){
  if (!inMonth(d, state.mo)) return false;
  if (state.c.size && !state.c.has(d.g)) return false;
  if (state.b.size && ![...secsOf(d)].some(k => state.b.has(k))) return false;
  if (state.p.size && ![...state.p].some(k => d.m.includes(k))) return false;
  if (state.q && !d.name) return false; /* 대외비 항목은 이름 검색에 걸리지 않음 */
  if (state.q && !d.name.toLowerCase().includes(state.q.toLowerCase())) return false;

function render(){

  mainEl.querySelectorAll('.sec').forEach(sec => {

function monthlyEntries(mo){ /* 월별 변경 내역: 신규 기관 · 제품 추가 기관 (현재 분야·제품·검색 조건 안에서) */
  const out = [];
  for (const g of GROUPS) for (const d of byGroup[g]) {
    if (!matches(d) || !d.name) continue;
    if (isNewIn(d, mo)) out.push({ kind:'new', d, ks: [...d.m] });
    else { const nm = newMarks(d, mo); if (nm.length) out.push({ kind:'add', d, ks: nm }); }
  }
  return out.sort((a, b) => (a.kind === 'new' ? 0 : 1) - (b.kind === 'new' ? 0 : 1));
}
function renderMonthly(){
  const box = document.getElementById('monthly'), mo = state.mo;
  if (!mo) { box.hidden = true; return; }

  box.hidden = ents.length === 0 && memos.length === 0;

  const groupOf = d => d.g + (d.r ? ' ' + d.r : '');
  document.getElementById('monthlyList').innerHTML = ents.map(({kind, d, ks}) => `<li>
    <span class="tag${kind === 'add' ? ' add' : ''}">${kind === 'new' ? 'NEW' : '제품 추가'}</span>
    <span class="who">${esc(d.name)} <small>${esc(groupOf(d))}</small> <span class="marks">${ks.map(k => `<i class="mk" data-k="${k}">${k}</i>`).join('')}</span></span>
    <span class="memo">${esc((d.notes || {})[mo] || '')}</span></li>`).join('') +
    memos.map(l => `<li class="note"><span class="memo">${esc(l.text)}</span></li>`).join('');
}
function conditionText(omitB){
  const sel = PRODUCTS.filter(p => state.p.has(p.k)), cats = GROUPS.filter(g => state.c.has(g)), q = state.q;
  const parts = [];
  if (state.mo) parts.push(`${monthLabel(state.mo)} 신규`);
  const bsel = SECS.filter(sc => state.b.has(sc.k)); if (bsel.length && !omitB) parts.push(bsel.map(x => x.name).join(', ') + ' 기관');
  if (cats.length) parts.push(cats.join(', '));
  if (sel.length) parts.push(`${sel.map(p => p.name).join(', ')}${sel.length > 1 ? ' 중 하나 이상 도입' : ' 도입'}`);
  if (q) parts.push(`‘${q}’ 검색`);
  if (!parts.length) return '';
  return `표시 조건: ${parts.join(' · ')} — ${DATA.filter(matches).length}곳`;
}

document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const pwEl = document.getElementById('pw'), msg = document.getElementById('gateMsg');
  msg.className = 'msg';
  if (!(window.crypto && crypto.subtle)) { msg.textContent = '보안 연결(https) 또는 로컬 파일에서만 열람할 수 있습니다.'; msg.classList.add('err'); return; }
  if (!pwEl.value) { pwEl.focus(); return; }
  msg.textContent = '확인 중…';
  try {
    const names = await decryptPrivate(pwEl.value);
    pwEl.value = '';
    msg.textContent = '';
    setPrivate(names);
  } catch (err) {
    msg.textContent = '비밀번호가 맞지 않습니다.';

  }
});

  if (IMG_CACHE.has(dataUrl)) return IMG_CACHE.get(dataUrl);
  const m = /^data:image\/jpeg;base64,(.+)$/.exec(dataUrl); if (!m) return null;
  const bytes = b64bytes(m[1]); const sz = jpegSize(bytes); if (!sz) return null;
  const rec = { bytes, w: sz.w, h: sz.h, name: 'Lg' + (IMG_CACHE.size + 1) };
  IMG_CACHE.set(dataUrl, rec); return rec;
}
class Page {
  constructor(){ this.ops = []; this.fonts = new Set(); this.imgs = new Set(); }
  x(v){ return n2(v*MM); }
  y(v){ return n2((PAGE.h - v)*MM); }
  fill(c){ this.ops.push(`${c.map(n2).join(' ')} rg`); }
  stroke(c){ this.ops.push(`${c.map(n2).join(' ')} RG`); }
  rrect(x, y, w, h, r, mode){ /* mode: 'f' | 'S' | 'B' */
    const k = 0.5523, X = v => n2(v*MM), Y = v => n2((PAGE.h - v)*MM);
    const x0=x, x1=x+w, y0=y, y1=y+h;
    this.ops.push(`${X(x0+r)} ${Y(y0)} m ${X(x1-r)} ${Y(y0)} l`);
    this.ops.push(`${X(x1-r+r*k)} ${Y(y0)} ${X(x1)} ${Y(y0+r-r*k)} ${X(x1)} ${Y(y0+r)} c`);
    this.ops.push(`${X(x1)} ${Y(y1-r)} l`);
    this.ops.push(`${X(x1)} ${Y(y1-r+r*k)} ${X(x1-r+r*k)} ${Y(y1)} ${X(x1-r)} ${Y(y1)} c`);
    this.ops.push(`${X(x0+r)} ${Y(y1)} l`);
    this.ops.push(`${X(x0+r-r*k)} ${Y(y1)} ${X(x0)} ${Y(y1-r+r*k)} ${X(x0)} ${Y(y1-r)} c`);
    this.ops.push(`${X(x0)} ${Y(y0+r)} l`);
    this.ops.push(`${X(x0)} ${Y(y0+r-r*k)} ${X(x0+r-r*k)} ${Y(y0)} ${X(x0+r)} ${Y(y0)} c h ${mode}`);
  }
  circle(cx, cy, r){
    const k = 0.5523, X = v => n2(v*MM), Y = v => n2((PAGE.h - v)*MM);
    this.ops.push(`${X(cx+r)} ${Y(cy)} m`);
    this.ops.push(`${X(cx+r)} ${Y(cy-r*k)} ${X(cx+r*k)} ${Y(cy-r)} ${X(cx)} ${Y(cy-r)} c`);
    this.ops.push(`${X(cx-r*k)} ${Y(cy-r)} ${X(cx-r)} ${Y(cy-r*k)} ${X(cx-r)} ${Y(cy)} c`);
    this.ops.push(`${X(cx-r)} ${Y(cy+r*k)} ${X(cx-r*k)} ${Y(cy+r)} ${X(cx)} ${Y(cy+r)} c`);
    this.ops.push(`${X(cx+r*k)} ${Y(cy+r)} ${X(cx+r)} ${Y(cy+r*k)} ${X(cx+r)} ${Y(cy)} c h f`);
  }
  line(x1, y1, x2, y2, w){ this.ops.push(`${n2(w)} w ${this.x(x1)} ${this.y(y1)} m ${this.x(x2)} ${this.y(y2)} l S`); }
  text(fk, size, x, y, str, color, opts = {}){ /* y = baseline(mm). align: left|right|center. tracking(em) */
    this.fonts.add(fk);
    const tr = opts.tracking || 0;
    let w = tw(fk, str, size) / MM + (tr ? tr*size/MM*(str.length-1) : 0);
    let x0 = x; if (opts.align === 'right') x0 = x - w; else if (opts.align === 'center') x0 = x - w/2;
    this.fill(color);
    this.ops.push(`BT /${fk} ${n2(size)} Tf ${n2(tr*size)} Tc ${this.x(x0)} ${this.y(y)} Td <${hex(gidsOf(fk, str))}> Tj ET`);
    return w;
  }
  mark(cx, cy, r, k, fillColor, textColor){
    this.fill(fillColor); this.circle(cx, cy, r);
    const size = r*2*0.6*MM;                     /* 지름의 60% (pt) */
    const capH = PDF_FONTS.HB.cap/1000*size/MM;  /* 대문자 높이 (mm) */
    this.text('HB', size, cx, cy + capH/2, k, textColor, {align:'center'});
  }
  image(x, y, w, h, name = 'Im1'){ this.ops.push(`q ${n2(w*MM)} 0 0 ${n2(h*MM)} ${this.x(x)} ${this.y(y+h)} cm /${name} Do Q`); }
  logo(rec, x, y, box){ /* box(mm) 안에 비율 유지해 가운데 배치 */
    const s = Math.min(box / rec.w, box / rec.h), w = rec.w * s, h = rec.h * s;
    this.imgs.add(rec); this.image(x + (box - w)/2, y + (box - h)/2, w, h, rec.name);
  }
}

/* ---- 문서 조립 ---- */
function buildPDF(pages, meta){
  const objs = []; const add = (dict, stream) => { objs.push({dict, stream}); return objs.length; };
  const fontIds = {};
  for (const fk of Object.keys(PDF_FONTS)) {
    const f = PDF_FONTS[fk], data = b64bytes(f.b64);
    const ff = add(`<< /Length ${data.length} /Length1 ${data.length} >>`, data);
    const fd = add(`<< /Type /FontDescriptor /FontName /GITSN+${fk} /Flags 4 /FontBBox [${f.bbox.join(' ')}] /ItalicAngle 0 /Ascent ${f.asc} /Descent ${f.desc} /CapHeight ${f.cap} /StemV 80 /FontFile2 ${ff} 0 R >>`);
    const cid = add(`<< /Type /Font /Subtype /CIDFontType2 /BaseFont /GITSN+${fk} /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >> /FontDescriptor ${fd} 0 R /DW 1000 /W [0 [${f.w.join(' ')}]] /CIDToGIDMap /Identity >>`);
    const pairs = Object.entries(f.cmap).map(([ch, g]) => `<${g.toString(16).padStart(4,'0')}> <${ch.codePointAt(0).toString(16).padStart(4,'0')}>`);
    let cm = '/CIDInit /ProcSet findresource begin 12 dict begin begincmap /CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def /CMapName /Adobe-Identity-UCS def /CMapType 2 def 1 begincodespacerange <0000> <FFFF> endcodespacerange\n';
    for (let i=0;i<pairs.length;i+=100) cm += `${Math.min(100, pairs.length-i)} beginbfchar\n${pairs.slice(i,i+100).join('\n')}\nendbfchar\n`;
    cm += 'endcmap CMapName currentdict /CMap defineresource pop end end';
    const cmb = enc.encode(cm);
    const tu = add(`<< /Length ${cmb.length} >>`, cmb);
    fontIds[fk] = add(`<< /Type /Font /Subtype /Type0 /BaseFont /GITSN+${fk} /Encoding /Identity-H /DescendantFonts [${cid} 0 R] /ToUnicode ${tu} 0 R >>`);
  }
  const logo = b64bytes(PDF_LOGO.b64);
  const imId = add(`<< /Type /XObject /Subtype /Image /Width ${PDF_LOGO.w} /Height ${PDF_LOGO.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${logo.length} >>`, logo);
  const fontRes = Object.entries(fontIds).map(([k,id]) => `/${k} ${id} 0 R`).join(' ');
  const imgIds = new Map();
  for (const rec of IMG_CACHE.values()) imgIds.set(rec, add(`<< /Type /XObject /Subtype /Image /Width ${rec.w} /Height ${rec.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${rec.bytes.length} >>`, rec.bytes));
  const pagesId = objs.length + 1 + pages.length*2; /* 나중에 채움 */
  const pageIds = [];
  for (const pg of pages) {
    const content = enc.encode(pg.ops.join('\n'));
    const cId = add(`<< /Length ${content.length} >>`, content);
    const xo = `/Im1 ${imId} 0 R ` + [...pg.imgs].map(r => `/${r.name} ${imgIds.get(r)} 0 R`).join(' ');
    pageIds.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${n2(PAGE.w*MM)} ${n2(PAGE.h*MM)}] /Resources << /Font << ${fontRes} >> /XObject << ${xo} >> >> /Contents ${cId} 0 R >>`));
  }
  const pid = add(`<< /Type /Pages /Kids [${pageIds.map(i => i + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`);
  if (pid !== pagesId) throw new Error('pages id');
  const toHex16 = s => '<FEFF' + Array.from(s, ch => ch.charCodeAt(0).toString(16).padStart(4,'0')).join('') + '>';
  const info = add(`<< /Title ${toHex16(meta.title)} /Author ${toHex16('㈜지슨 GITSN')} /Creator ${toHex16('지슨 주요 고객사')} >>`);
  const cat = add(`<< /Type /Catalog /Pages ${pid} 0 R >>`);
  /* 바이트 조립 */
  const parts = []; let off = 0; const offs = [];
  const push = u => { parts.push(u); off += u.length; };
  push(enc.encode('%PDF-1.7\n%\u00e2\u00e3\u00cf\u00d3\n'));
  objs.forEach((o, i) => {
    offs.push(off);
    push(enc.encode(`${i+1} 0 obj\n${o.dict}\n`));
    if (o.stream) { push(enc.encode('stream\n')); push(o.stream); push(enc.encode('\nendstream\n')); }
    push(enc.encode('endobj\n'));
  });
  const xref = off;
  let x = `xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
  for (const o of offs) x += `${String(o).padStart(10,'0')} 00000 n \n`;
  x += `trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  push(enc.encode(x));
  return new Blob(parts, {type:'application/pdf'});
}

/* ---- 조판 ---- */
function wrapText(fk, size, text, maxW, maxLines){
  const lines = []; let cur = '';
  const fits = s => tw(fk, s, size)/MM <= maxW;
  const words = text.split(' ');
  for (const w of words) {
    const cand = cur ? cur + ' ' + w : w;
    if (fits(cand)) { cur = cand; continue; }
    if (cur) { lines.push(cur); cur = ''; }
    /* 한 단어가 너무 길면 글자 단위로 */
    let piece = '';
    for (const ch of w) { if (fits(piece + ch)) piece += ch; else { lines.push(piece); piece = ch; } }
    cur = piece;
  }
  if (cur) lines.push(cur);
  if (maxLines && lines.length > maxLines) { lines.length = maxLines; let l = lines[maxLines-1]; while (l.length && !fits(l + '…')) l = l.slice(0,-1); lines[maxLines-1] = l + '…'; }
  return lines;
}

function generatePDF(){
  const q = state.q, sel = PRODUCTS.filter(p => state.p.has(p.k)), active = sel.length > 0 || state.b.size > 0 || state.c.size > 0 || !!q || !!state.mo;
  const pages = []; let pg, y;
  const newPage = () => { pg = new Page(); pages.push(pg); y = PAGE.top; };
  const remain = () => PAGE.h - PAGE.bottom - y;
  newPage();

  /* 머리 */
  const lh = 7, lw = lh * PDF_LOGO.w / PDF_LOGO.h;
  pg.image(PAGE.left, y, lw, lh);
  y += 17;
  pg.text('B', 17, PAGE.left, y, SITE_T.title, PDFC.ink);
  const heroW = pg.text('HB', 30, PAGE.w - PAGE.right - tw('HM', 'clients', 10)/MM - 2, y + 1, String(DATA.length), PDFC.navy, {align:'right'});
  pg.text('HM', 10, PAGE.w - PAGE.right, y + 1, 'clients', PDFC.mut, {align:'right'});
  const bsel = SECS.filter(sc => state.b.has(sc.k));
  if (bsel.length) { y += 7.5; const sx = PAGE.left + pg.text('B', 11.5, PAGE.left, y, bsel.map(x => x.name).join(' · ') + ' 도입 기관', PDFC.navy) + 2; pg.text('HB', 11.5, sx, y, String(DATA.filter(matches).length), PDFC.navy); pg.text('B', 11.5, sx + tw('HB', String(DATA.filter(matches).length), 11.5)/MM, y, '곳', PDFC.navy); }
  y += 7.5;
  const lead = SITE_T.lead;
  for (const ln of wrapText('R', 9, lead, 120)) { pg.text('R', 9, PAGE.left, y, ln, PDFC.sec); y += 5.1; }
  if (active) {
    y += 2.5;
    const ct = conditionText(true); if (ct) { pg.text('R', 8.5, PAGE.left, y, ct, PDFC.navy); y += 4; }

  }
  /* 범례: 대분류 세 묶음 */
  y += 6;
  /* 제품 마크 범례 (오른쪽 정렬) */
  let lx = PAGE.w - PAGE.right;
  for (const pr of [...PRODUCTS].reverse()) {
    lx -= tw('HM', pr.name, 7.5)/MM; pg.text('HM', 7.5, lx, y, pr.name, PDFC.sec);
    lx -= 1.2 + 1.4; pg.mark(lx, y - 1.0, 1.4, pr.k, PDFC.mark[pr.k], PDFC.white);
    lx -= 1.4 + 4.5;
  }
  y += 4;

  /* 격자 치수 */
  const cols = 5, gap = 2.5, cw = (PAGE.cw - gap*(cols-1)) / cols, ch = 25.5;
  const footer = (pgx, i, n) => {
    const fy = PAGE.h - PAGE.bottom + 7;
    let fx = PAGE.left;
    if (privateUnlocked) { fx += pgx.text('B', 7.5, fx, fy, '대외비 — 외부 공유 금지', PDFC.navy) + 3; }
    pgx.text('R', 7.5, fx, fy, `㈜지슨 ${SITE_T.title}  ·  ${SITE_T.basisLabel}`, PDFC.mut);
    pgx.text('HM', 7.5, PAGE.w - PAGE.right, fy, `${i} / ${n}`, PDFC.mut, {align:'right'});
  };
  const drawCard = (x, yy, d) => {
    pg.stroke(PDFC.line); pg.ops.push('0.4 w'); pg.fill(PDFC.white); pg.rrect(x, yy, cw, ch, 2, 'B');
    /* 로고 자리 */
    const tx = x + cw/2 - 5, ty = yy + 2.4;
    const rec = d.logo ? imgOf(d.logo) : null;
    if (rec) { const bw = 24, bh = 10.4, s2 = Math.min(bw / rec.w, bh / rec.h), w = rec.w * s2, h = rec.h * s2; pg.imgs.add(rec); pg.image(x + (cw - w)/2, ty + (bh - h)/2, w, h, rec.name); }
    else {
      pg.fill(PDFC.tile); pg.rrect(tx, ty, 10, 10, 1.6, 'f');
      if (d.cc) pg.text('HB', 8, x + cw/2, ty + 6.6, d.cc, PDFC.sec, {align:'center', tracking:0.06});
      else { const [m, latin] = mono(d.name); latin ? pg.text('HB', 8, x + cw/2, ty + 6.6, m, PDFC.sec, {align:'center', tracking:0.06}) : pg.text('R', 9, x + cw/2, ty + 6.7, m, PDFC.sec, {align:'center'}); }
    }
    /* 월별 보기: 신규 기관 태그 · 신규 마크 표시 */
    const mo = state.mo, isNew = mo && isNewIn(d, mo), nm = mo && !isNew ? newMarks(d, mo) : [];
    if (isNew) { pg.fill(PDFC.navy); pg.rrect(x + 1.6, yy + 1.6, 7.2, 3.2, 0.8, 'f'); pg.text('HB', 5, x + 1.6 + 3.6, yy + 1.6 + 2.35, 'NEW', PDFC.white, {align:'center', tracking:0.06}); }
    /* 마크: 오른쪽 아래 */
    const ks = PRODUCTS.filter(p => d.m.includes(p.k)).map(p => p.k);
    let mx = x + cw - 1.8 - 1.5;
    for (const k of ks.reverse()) {
      const on = (!sel.length || state.p.has(k)) && !(mo && !isNew && !nm.includes(k));
      if (nm.includes(k)) { pg.fill(PDFC.navy); pg.circle(mx, yy + 15.3, 2.05); pg.fill(PDFC.white); pg.circle(mx, yy + 15.3, 1.75); }
      pg.mark(mx, yy + 15.3, 1.5, k, on ? PDFC.mark[k] : PDFC.tile, on ? PDFC.white : PDFC.dis);
      mx -= 3.0 + 0.7;
    }
    /* 이름 */
    const lines = wrapText('R', 8, d.name, cw - 3, 2);
    const base = lines.length === 1 ? yy + 21.6 : yy + 19.9;
    lines.forEach((ln, i) => pg.text('R', 8, x + cw/2, base + i*3.6, ln, PDFC.ink, {align:'center'}));
  };
  const drawGrid = items => {
    for (let i = 0; i < items.length; i += cols) {
      if (remain() < ch) newPage();
      items.slice(i, i+cols).forEach((d, j) => drawCard(PAGE.left + j*(cw+gap), y, d));
      y += ch + gap;
    }
  };
  /* 월별 보기: 변경 내역 */
  if (state.mo) {
    const ents = monthlyEntries(state.mo), memos = (SITE.log || []).filter(l => l.ym === state.mo);
    if (ents.length || memos.length) {
      y += 6;
      pg.text('B', 13, PAGE.left, y + 4.5, `${monthLabel(state.mo)} 변경 내역`, PDFC.ink); y += 10;
      const colX = PAGE.left + 16, memoX = PAGE.left + 16, memoW = PAGE.cw - 16;
      for (const {kind, d, ks} of ents) {
        const memo = (d.notes || {})[state.mo] || '';
        const lines = memo ? wrapText('R', 8.5, memo, memoW) : [];
        const rowH = 6 + lines.length * 4.4 + 2.5;
        if (remain() < rowH) newPage();
        if (kind === 'new') { pg.fill(PDFC.navy); pg.rrect(PAGE.left, y + 0.6, 9, 4.2, 0.8, 'f'); pg.text('HB', 5.5, PAGE.left + 4.5, y + 3.6, 'NEW', PDFC.white, {align:'center', tracking:0.06}); }
        else { pg.fill(PDFC.tile); pg.rrect(PAGE.left, y + 0.6, 12.5, 4.2, 0.8, 'f'); pg.text('B', 6.5, PAGE.left + 6.25, y + 3.6, '제품 추가', PDFC.navy, {align:'center'}); }
        let tx = colX + (kind === 'new' ? 0 : 0);
        tx += pg.text('B', 9.5, tx, y + 4, d.name, PDFC.ink) + 2;
        tx += pg.text('R', 8, tx, y + 4, d.g + (d.r ? ' ' + d.r : ''), PDFC.mut) + 2.5;
        for (const k of ks) { pg.mark(tx + 1.4, y + 2.7, 1.4, k, PDFC.mark[k], PDFC.white); tx += 2.8 + 0.7; }
        let ly = y + 9;
        for (const ln of lines) { pg.text('R', 8.5, memoX, ly, ln, PDFC.sec); ly += 4.4; }
        y += rowH;
      }
      for (const l of memos) {
        const lines = wrapText('R', 8.5, l.text, PAGE.cw - 4);
        if (remain() < lines.length * 4.4 + 3) newPage();
        pg.text('R', 8.5, PAGE.left, y + 3.5, '·', PDFC.mut);
        lines.forEach((ln, i) => pg.text('R', 8.5, PAGE.left + 3, y + 3.5 + i*4.4, ln, PDFC.sec));
        y += lines.length * 4.4 + 2.5;
      }
      y += 2;
    }
  }
  const secHead = (title, n, all, tag) => {
    if (remain() < 12 + ch) newPage();
    y += (y === PAGE.top ? 2 : 6);
    let hx = PAGE.left + pg.text('B', 13, PAGE.left, y + 4.5, title, PDFC.ink) + 2.5;
    hx += pg.text('HB', 13, hx, y + 4.5, String(n), PDFC.navy);
    if (n !== all) pg.text('HM', 9, hx + 1.5, y + 4.5, `/ ${all}`, PDFC.mut);
    if (tag) pg.text('B', 8, PAGE.w - PAGE.right, y + 4.5, tag, PDFC.navy, {align:'right'});
    y += 10;
  };
  const subHead = (title, n, all) => {
    if (remain() < 8 + ch) newPage();
    y += 2;
    let hx = PAGE.left + pg.text('B', 10, PAGE.left, y + 3.5, title, PDFC.ink) + 2;
    pg.text('HM', 9, hx, y + 3.5, n === all ? String(all) : `${n} / ${all}`, PDFC.mut);
    y += 7.5;
  };

  for (const g of GROUPS) {
    const all = byGroup[g], vis = all.filter(matches);
    if (!vis.length) continue;
    const isPriv = g === '민간';
    secHead(g, vis.length, all.length, isPriv && privateUnlocked ? '대외비 — 외부 공유 금지' : null);
    if (isPriv && !privateUnlocked) {
      const bh = 14;
      if (remain() < bh) newPage();
      pg.fill(PDFC.box); pg.rrect(PAGE.left, y, PAGE.cw, bh, 2, 'f');
      pg.text('B', 10, PAGE.left + 5, y + 8.6, '민간 기업은 대외비입니다.', PDFC.ink);
      y += bh + 4;
      continue;
    }
    if (g === '지자체' || g === '지자체 의회') {
      for (const r of REGIONS) {
        const ra = all.filter(d => d.r === r), rv = ra.filter(matches);
        if (!rv.length) continue;
        subHead(r, rv.length, ra.length);
        drawGrid(rv);
      }
    } else drawGrid(vis);
  }
  pages.forEach((p, i) => footer(p, i+1, pages.length));
  const title = `지슨 ${SITE_T.title} — ${SITE_T.monthLabel}${active ? ' (조건 보기)' : ''}`;
  const blob = buildPDF(pages, {title});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `지슨_주요고객사_${SITE_T.yymm}${active ? '_조건' : ''}${privateUnlocked ? '_대외비' : ''}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
